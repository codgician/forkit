# Forkit configuration for codgician/litellm.
#
# main  mirrors upstream's own main branch, unpatched, never built.
# my    tracks the newest stable release and carries the contributions below.

fork: codgician/litellm

upstream:
  repository: BerriAI/litellm
  # Development branch: upstream PRs base on it, and contributions without an
  # open PR use it as their merge-base.
  branch: main

branches:
  main:
    track:
      # Upstream's main. This fork's main was created from it; repointing
      # would replace its lineage.
      branch: main

  my:
    track:
      releases:
        prerelease: false
        # Stable releases carry no suffix; -rc.N and -dev.N are prereleases.
        match: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    contributions:
      - type: branch
        name: litellm_configurable_copilot_headers
      # Required upstream fix: https://github.com/BerriAI/litellm/pull/39512
      - type: pr
        number: 39512
    # Generated branch: a resolution here is private to this fork, so the
    # resolver is allowed to attempt one.
    on_conflict: ai
    container:
      image: ghcr.io/codgician/litellm
      # One manifest list per tag: the tag never encodes an architecture.
      platforms:
        - linux/amd64
        - linux/arm64
      # Proves the image starts and the package imports. Catches an image that
      # builds but cannot run, which is what a bad resolution tends to produce.
      smoke:
        entrypoint: litellm
        command: ["--version"]
