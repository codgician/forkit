fork: codgician/redrix-ec

upstream:
  git: https://chromium.googlesource.com/chromiumos/platform/ec
  branch: ec-legacy

branches:
  ec-legacy:
    track:
      branch: ec-legacy

  my:
    track:
      branch: ec-legacy
    # Independent patches based on the official R151 firmware source.
    # These are permanent downstream patches, not upstream review requests.
    contributions:
      - type: branch
        name: patches/mkbp-host-events
        base: b5f7b64a1d8f86b82f8e1ea6290d97a2dedea12d
        cleanup: manual
      - type: branch
        name: patches/mkbp-sci-mask
        base: b5f7b64a1d8f86b82f8e1ea6290d97a2dedea12d
        cleanup: manual
      - type: branch
        name: patches/backlight-sysjump
        base: b5f7b64a1d8f86b82f8e1ea6290d97a2dedea12d
        cleanup: manual
    on_conflict: fail
    validation:
      command: [bash, -c, 'exec "$FORKIT_CONFIG_DIR/validate.sh"']
      timeout_minutes: 60
