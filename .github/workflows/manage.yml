name: Manage forks

on:
  schedule:
    # GitHub schedules in UTC: 12:00 UTC is 20:00 UTC+8.
    - cron: "0 12 * * *"
  # A push builds every platform but publishes nothing. Publishing a code change
  # and deciding to release it are different acts.
  push:
    branches: [main]
    paths:
      - "repositories/**"
      - "src/**"
      - ".github/**"
      - ".pi/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:
    inputs:
      repository:
        description: Managed fork to run, e.g. codgician/litellm. Empty runs all.
        required: false
      dry_run:
        description: Compose and build without pushing anything
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      repositories: ${{ steps.plan.outputs.repositories }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - id: plan
        env:
          FORKIT_REPOSITORY: ${{ inputs.repository }}
        run: |
          plan=$(nix develop --command pi --no-session -p /forkit-plan)
          echo "repositories=$(jq -c '.repositories' <<<"$plan")" >> "$GITHUB_OUTPUT"

  # One isolated DAG per fork. A failure in one does not block another: each
  # reusable-workflow call owns its compose, native architecture builds, and
  # publish step.
  manage:
    needs: discover
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover.outputs.repositories) }}
      fail-fast: false
    uses: ./.github/workflows/_manage-repository.yml
    with:
      repository: ${{ matrix.repository }}
      artifact: ${{ matrix.artifact }}
      dry_run: ${{ github.event_name == 'push' || inputs.dry_run == true }}
    secrets: inherit
