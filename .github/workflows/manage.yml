name: Manage forks

on:
  schedule:
    # Hourly, off the top of the hour: scheduled runs are delayed most when
    # every repository on GitHub asks at :00.
    - cron: "23 * * * *"
  # Pushes verify the engine without writing: a code change should not publish
  # before it has been seen working.
  push:
    branches: [main]
    paths:
      - "repositories/**"
      - "src/**"
      - ".github/workflows/manage.yml"
  workflow_dispatch:
    inputs:
      repository:
        description: Managed fork to run, e.g. codgician/litellm. Empty runs all.
        required: false
      dry_run:
        description: Compose and build without pushing anything
        type: boolean
        default: false

# One run per repository at a time. Two concurrent runs would race on the same
# branches and container tags.
concurrency:
  group: manage
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is scoped to this repository, so it cannot push to a
      # managed fork. The App installation can.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FORKIT_APP_ID }}
          private-key: ${{ secrets.FORKIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check required secrets
        env:
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
        run: |
          missing=""
          [ -n "$DENDRO_API_KEY" ] || missing="$missing DENDRO_API_KEY"
          [ -n "$TRAJECTORY_ZIP_PASSWD" ] || missing="$missing TRAJECTORY_ZIP_PASSWD"
          if [ -n "$missing" ]; then
            echo "::warning::unset secrets:$missing (conflicts will fail; trajectories will not be encrypted)"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # The litellm image builds a Next.js bundle and a full Python environment;
      # a stock runner does not have room for that alongside its preinstalled
      # toolchains.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run forkit
        env:
          # The App token, not GITHUB_TOKEN: pushes target the managed fork.
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
          # A push verifies the engine; only a deliberate dispatch or the
          # schedule may write.
          FORKIT_DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && '1' || '0' }}
        run: bun run src/main.ts ${{ inputs.repository }}

      # Encrypted, and uploaded on failure too: a resolution that worked needs
      # no study, while one that tripped a gate is the tuning signal.
      - name: Upload resolver trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-${{ github.run_id }}
          path: trajectory/*.7z
          if-no-files-found: ignore
          retention-days: 90
