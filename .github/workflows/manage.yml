name: Manage forks

on:
  schedule:
    # Hourly, off the top of the hour: scheduled runs are delayed most when
    # every repository on GitHub asks at :00.
    - cron: "23 * * * *"
  # Pushes verify the engine without writing: a code change should not publish
  # before it has been seen working.
  push:
    branches: [main]
    paths:
      - "repositories/**"
      - "src/**"
      - ".github/workflows/manage.yml"
  workflow_dispatch:
    inputs:
      repository:
        description: Managed fork to run, e.g. codgician/litellm. Empty runs all.
        required: false
      dry_run:
        description: Compose and build without pushing anything
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # Also validates every config: a malformed one fails here, before any
      # fork is touched.
      - id: list
        run: |
          repositories=$(bun run src/main.ts --list ${{ inputs.repository }})
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
          echo "$repositories"

  manage:
    needs: discover
    runs-on: ubuntu-latest
    # A cross-architecture build runs the non-native half under emulation.
    timeout-minutes: 360

    strategy:
      # One fork per runner. They share no state, and a container build is long
      # enough that running them in sequence would not fit a single job.
      matrix:
        repository: ${{ fromJson(needs.discover.outputs.repositories) }}
      # A failure in one fork must not cancel the others.
      fail-fast: false

    # Serialised per fork, not globally: two runs of the same fork would race on
    # its branches and tags, but different forks never touch the same refs.
    concurrency:
      group: manage-${{ matrix.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is scoped to this repository, so it cannot push to a
      # managed fork. The App installation can.
      - name: Generate publisher token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: read
          # A managed branch mirrors upstream or is built from a release tag, so
          # its tree carries upstream's own CI definitions. Advancing the branch
          # updates .github/workflows, which GitHub blocks from an App without
          # this. Forkit never authors a workflow change; compose refuses a
          # contribution that would.
          permission-workflows: write

      - name: Check optional secrets
        env:
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
        run: |
          missing=""
          [ -n "$DENDRO_API_KEY" ] || missing="$missing DENDRO_API_KEY"
          [ -n "$TRAJECTORY_ZIP_PASSWD" ] || missing="$missing TRAJECTORY_ZIP_PASSWD"
          if [ -n "$missing" ]; then
            echo "::warning::unset secrets:$missing (conflicts will fail; trajectories will not be encrypted)"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # A source build of a large project needs more room than a stock runner
      # has alongside its preinstalled toolchains.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # arm64 is built under emulation on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run forkit
        env:
          # The App token, not GITHUB_TOKEN: pushes target the managed fork.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
          # A push verifies the engine; only a deliberate dispatch or the
          # schedule may write.
          FORKIT_DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && '1' || '0' }}
        run: bun run src/main.ts ${{ matrix.repository }}

      # Encrypted, and uploaded on failure too: a resolution that worked needs
      # no study, while one that tripped a gate is the tuning signal.
      - name: Upload resolver trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Matrix jobs share a run, so the fork has to be in the name.
          name: trajectory-${{ github.run_id }}-${{ strategy.job-index }}
          path: trajectory/*.7z
          if-no-files-found: ignore
          retention-days: 90
