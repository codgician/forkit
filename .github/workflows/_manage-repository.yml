name: Manage one fork

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      artifact:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  # Compose once. The bundle is the exact commit every architecture builds and
  # the publisher later pushes; AI can therefore never resolve two platforms
  # differently.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      builds: ${{ steps.compose.outputs.builds }}
      changed: ${{ steps.compose.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate reader token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compose
        id: compose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
        run: >-
          bun run src/main.ts --compose
          --repository "${{ inputs.repository }}"
          --artifact source
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: source/
          retention-days: 1
      - name: Upload resolver trajectories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trajectory-${{ github.run_id }}-${{ inputs.artifact }}
          path: trajectory/*.7z
          if-no-files-found: ignore
          retention-days: 90

  # A native runner per architecture, all on Ubuntu 24.04. No QEMU.
  build:
    needs: compose
    if: needs.compose.outputs.changed == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.compose.outputs.builds) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: source
      - name: Build ${{ matrix.platform }}
        env:
          FORKIT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORKIT_DIGEST_FILE: digests.txt
        run: >-
          bun run src/main.ts --build
          --repository "${{ inputs.repository }}"
          --artifact source
          --platform "${{ matrix.platform }}"
      - run: touch digests.txt
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.artifact }}-${{ strategy.job-index }}
          path: digests.txt
          retention-days: 1

  publish:
    needs: [compose, build]
    if: >-
      always() && needs.compose.result == 'success' &&
      needs.compose.outputs.changed == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-${{ inputs.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Generate publisher token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: read
          # Managed trees carry upstream's CI. Advancing one updates workflow
          # files; compose refuses any contribution that would author one.
          permission-workflows: write
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ inputs.artifact }}-*
          path: digests
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          bun run src/main.ts --publish
          --repository "${{ inputs.repository }}"
          --artifact source
          --digests digests
