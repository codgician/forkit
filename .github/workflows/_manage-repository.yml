name: Manage one fork

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      artifact:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # Compose once. The bundle is the exact commit every architecture builds and
  # the publisher later pushes; AI can therefore never resolve two platforms
  # differently.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      builds: ${{ steps.compose.outputs.builds }}
      has_builds: ${{ steps.compose.outputs.has_builds }}
      changed: ${{ steps.compose.outputs.changed }}
      cleanup: ${{ steps.compose.outputs.cleanup }}
      failed: ${{ steps.compose.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate reader token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if nix develop --command bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Compose
        id: compose
        env:
          FORKIT_REPOSITORY: ${{ inputs.repository }}
          FORKIT_ALLOW_PARTIAL: '1'
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DENDRO_API_KEY: ${{ secrets.DENDRO_API_KEY }}
          TRAJECTORY_ZIP_PASSWD: ${{ secrets.TRAJECTORY_ZIP_PASSWD }}
        run: nix develop --command pi --no-session -p /forkit-compose
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: source/
          retention-days: 1
      - name: Upload resolver trajectories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trajectory-${{ github.run_id }}-${{ inputs.artifact }}
          path: trajectory/*.7z
          if-no-files-found: ignore
          retention-days: 90

  # A native runner per architecture, all on Ubuntu 24.04. No QEMU.
  build:
    needs: compose
    if: needs.compose.outputs.changed == 'true' && needs.compose.outputs.has_builds == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.compose.outputs.builds) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if nix develop --command bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: source
      - name: Build ${{ matrix.platform }}
        env:
          FORKIT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORKIT_REPOSITORY: ${{ inputs.repository }}
          FORKIT_PLATFORM: ${{ matrix.platform }}
          FORKIT_DIGEST_FILE: digests.txt
        run: nix develop --command pi --no-session -p /forkit-build
      - run: touch digests.txt
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest-${{ inputs.artifact }}-${{ strategy.job-index }}
          path: digests.txt
          retention-days: 1

  publish:
    needs: [compose, build]
    if: >-
      always() && !cancelled() && needs.compose.result == 'success' &&
      (needs.compose.outputs.changed == 'true' || needs.compose.outputs.cleanup == 'true') &&
      !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Download composed repository
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: source
      - name: Generate publisher token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: read
          # Managed trees carry upstream's CI. Advancing one updates workflow
          # files; compose refuses any contribution that would author one.
          permission-workflows: write
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if nix develop --command bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Prepare container publication
        if: needs.compose.outputs.has_builds == 'true'
        continue-on-error: true
        uses: ./.github/actions/prepare-container-publish
        with:
          artifact: ${{ inputs.artifact }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          FORKIT_REPOSITORY: ${{ inputs.repository }}
          FORKIT_CONFIG_REPOSITORY: ${{ github.repository }}
          FORKIT_CONFIG_BRANCH: ${{ github.ref_name }}
        run: nix develop --command pi --no-session -p /forkit-publish

  # Partial progress stays useful, but any failed target still makes the run red.
  result:
    needs: [compose, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check target results
        env:
          COMPOSE_RESULT: ${{ needs.compose.result }}
          COMPOSE_FAILED: ${{ needs.compose.outputs.failed }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$COMPOSE_RESULT" = success
          test "$COMPOSE_FAILED" = false
          test "$BUILD_RESULT" = success || test "$BUILD_RESULT" = skipped
          test "$PUBLISH_RESULT" = success || test "$PUBLISH_RESULT" = skipped
