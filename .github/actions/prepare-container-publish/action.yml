name: Prepare container publication
description: Authenticate to GHCR and download native build digests

inputs:
  artifact:
    description: Repository artifact name
    required: true
  username:
    description: GHCR username
    required: true
  password:
    description: GHCR token
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - uses: actions/download-artifact@v8
      with:
        pattern: digest-${{ inputs.artifact }}-*
        path: digests
